name: TianXianQuant
options:
  bundleIdPrefix: com.tianxianquant
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"

targets:
  TianXianQuant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TianXianQuant
        type: group
    settings:
      base:
        INFOPLIST_FILE: TianXianQuant/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tianxianquant.app
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "120"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: "NO"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

  TianXianQuantTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TianXianQuantTests
        type: group
    dependencies:
      - target: TianXianQuant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tianxianquant.app.tests
        INFOPLIST_FILE: TianXianQuantTests/Info.plist
